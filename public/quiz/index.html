  <main id="contenu" class="container">
    <header class="page-head">
      <span class="page-head__kicker">🧀 Quiz zinzins</span>
      <h1>Qui es-tu vraiment ?</h1>
      <p>Quelques questions, un résultat profondément vrai (ou pas). Choisis ton quiz.</p>

    <section class="quiz-list" id="quiz-list" aria-label="Choisir un quiz"></section>

    <section class="card quiz-run" id="quiz-run" hidden aria-live="polite">
      <p class="quiz-run__progress" id="quiz-progress"></p>
      <div class="quiz-run__bar" aria-hidden="true"><span id="quiz-bar"></span></div>
      <h2 class="quiz-run__question" id="quiz-question" tabindex="-1"></h2>
      <div class="quiz-run__answers" id="quiz-answers"></div>
    </section>

    <section class="card card--accent quiz-result" id="quiz-result" hidden aria-live="polite">
      <p class="quiz-result__kicker" id="result-quiz"></p>
      <p class="quiz-result__emoji" id="result-emoji" aria-hidden="true"></p>
      <h2 class="quiz-result__name" id="result-name"></h2>
      <p class="quiz-result__text" id="result-text"></p>
      <div class="row">
        <button class="btn btn--small" type="button" id="result-share">📤 Partager</button>
        <button class="btn btn--small" type="button" id="result-img">🖼️ Image</button>
        <button class="btn btn--small" type="button" id="result-again">🔁 Un autre quiz</button>
      </div>
    </section>
